name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/matt-linux-amd64 ./cmd/matt
          GOOS=linux GOARCH=arm64 go build -o dist/matt-linux-arm64 ./cmd/matt
          GOOS=darwin GOARCH=amd64 go build -o dist/matt-darwin-amd64 ./cmd/matt
          GOOS=darwin GOARCH=arm64 go build -o dist/matt-darwin-arm64 ./cmd/matt
          GOOS=windows GOARCH=amd64 go build -o dist/matt-windows-amd64.exe ./cmd/matt

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: matt-binaries
          path: dist/*
